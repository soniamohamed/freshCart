<div class="min-h-screen bg-gray-50/50">
  <div class="bg-gradient-to-r from-purple-600 via-purple-500 to-indigo-500 text-white shadow-md">
    <div class="container mx-auto px-4 py-8 sm:py-12">
      <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm text-white/80 mb-6">
        <a routerLink="/" class="hover:text-white">Home</a><span>/</span><span aria-current="page">Brands</span>
      </nav>
      <h1 class="text-2xl sm:text-4xl font-bold tracking-tight">Top Brands</h1>
      <p class="text-white/80 text-sm mt-2">Shop from your favorite brands</p>
    </div>
  </div>
  <section class="container mx-auto px-4 py-8 sm:py-12" [attr.aria-busy]="isLoading()">
    @if (isLoading()) {
      <p role="status" class="py-12 text-center text-gray-500">Loading brands...</p>
    } @else if (errorMessage()) {
      <div role="alert" class="rounded-xl bg-red-50 p-6 text-red-700">
        <p>{{ errorMessage() }}</p>
        <button type="button" (click)="getAllBrandsData()" class="mt-3 underline cursor-pointer">Try again</button>
      </div>
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-6">
        @for (brand of brandsList(); track brand._id) {
          <article class="group bg-white rounded-2xl border border-gray-100 p-4 sm:p-5 shadow-sm hover:shadow-xl hover:border-purple-200 transition-all duration-300 flex flex-col items-center">
            <div class="w-full aspect-square rounded-xl bg-gray-50/80 mb-3 p-4">
              <img [src]="brand.image" [alt]="brand.name" class="w-full h-full object-contain" loading="lazy" />
            </div>
            <h2 class="font-medium text-gray-800 text-center text-sm sm:text-base">{{ brand.name }}</h2>
            <a routerLink="/products" [queryParams]="{ brand: brand._id }" [attr.aria-label]="'View ' + brand.name + ' products'" class="mt-3 rounded-lg bg-purple-50 px-3 py-2 text-sm font-medium text-purple-700 hover:bg-purple-100">View Products &rarr;</a>
          </article>
        } @empty {
          <p class="col-span-full py-12 text-center text-gray-500">No brands available.</p>
        }
      </div>
    }
  </section>
</div>
